<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Refy UI · Playground</title>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/tokens/tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Switzer',system-ui,sans-serif;background:#f2f2f2;color:#0e0e10;display:grid;grid-template-columns:230px 1fr;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}

  .rail{background:#fff;border-right:1px solid #e8e8ea;display:flex;flex-direction:column;overflow:hidden;}
  .rail-head{padding:16px 16px 12px;border-bottom:1px solid #f1f1f3;}
  .logo{display:inline-flex;align-items:baseline;gap:5px;font-family:'Geist Mono',monospace;font-weight:700;font-size:17px;letter-spacing:-.02em;}
  .logo-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6);}
  .logo-sub{font-family:'Geist Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:#77767c;margin-top:5px;}
  .rail-list{padding:8px;overflow-y:auto;}
  .rail-grp{font-family:'Geist Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:#b5b3b8;padding:10px 10px 4px;}
  .rail-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;font-family:'Switzer',sans-serif;font-size:13px;color:#3e3e44;cursor:pointer;}
  .rail-item:hover{background:#f4f4f5;color:#0e0e10;}
  .rail-item.on{background:#ecfdf5;color:#006c49;font-weight:600;}

  .stage{display:flex;flex-direction:column;overflow:hidden;}
  .stage-head{height:52px;flex-shrink:0;background:#fff;border-bottom:1px solid #ececee;display:flex;align-items:center;padding:0 20px;gap:10px;}
  .stage-head h1{font-size:14px;font-weight:600;margin:0;}
  .stage-head .tag{font-family:'Geist Mono',monospace;font-size:10px;color:#77767c;background:#f4f4f5;border:1px solid #ececee;border-radius:5px;padding:3px 7px;}
  .stage-body{flex:1;overflow:auto;display:grid;grid-template-rows:1fr auto;}
  .canvas{display:flex;align-items:center;justify-content:center;padding:40px;background:
    linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.025) 1px,transparent 1px);
    background-size:22px 22px;}
  .controls{border-top:1px solid #ececee;background:#fff;padding:14px 20px;}
  .controls h2{font-family:'Geist Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#77767c;margin:0 0 10px;}
  .ctl-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .ctl{display:flex;flex-direction:column;gap:5px;}
  .ctl label{font-size:11px;color:#77767c;font-family:'Geist Mono',monospace;}
  .ctl select,.ctl input[type=text]{height:32px;border:1px solid #d4d4d8;border-radius:7px;padding:0 10px;font-family:'Switzer',sans-serif;font-size:13px;background:#fff;}
  .seg{display:inline-flex;background:#f4f4f5;border-radius:7px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;font-family:'Switzer',sans-serif;font-size:12px;padding:5px 11px;border-radius:5px;cursor:pointer;color:#3e3e44;}
  .seg button.on{background:#fff;color:#0e0e10;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#0e0e10;cursor:pointer;}
  .out{font-family:'Geist Mono',monospace;font-size:12px;color:#006c49;}

  /* ===== Calendar ===== */
  .cal{width:280px;background:#fff;border:1px solid #e8e8ea;border-radius:10px;padding:14px;user-select:none;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-month{font-weight:600;font-size:14px;letter-spacing:-.01em;}
  .cal-nav{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e8e8ea;border-radius:7px;background:#fff;color:#3e3e44;cursor:pointer;}
  .cal-nav:hover{background:#fafafa;border-color:#b5b3b8;color:#0e0e10;}
  .cal-nav svg{width:15px;height:15px;}
  .cal-weekrow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-weekrow{margin-bottom:4px;}
  .cal-wd{text-align:center;font-family:'Geist Mono',monospace;font-size:10px;font-weight:500;text-transform:uppercase;color:#77767c;padding:4px 0;}
  .cal-day{aspect-ratio:1/1;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:7px;font-family:inherit;font-size:13px;color:#0e0e10;cursor:pointer;font-variant-numeric:tabular-nums;}
  .cal-day:hover{background:#f1f1f3;}
  .cal-out{color:#b5b3b8;}
  .cal-today{box-shadow:inset 0 0 0 1px #10b981;color:#006c49;font-weight:600;}
  .cal-sel{background:#10b981;color:#fff;font-weight:600;}
  .cal-sel:hover{background:#006c49;}
  .cal-dis{color:#d4d4d8;cursor:not-allowed;}
  .cal-dis:hover{background:transparent;}

  /* ===== Accordion ===== */
  .acc{width:420px;border:1px solid #e8e8ea;border-radius:10px;overflow:hidden;background:#fff;}
  .acc-item+.acc-item{border-top:1px solid #e8e8ea;}
  .acc-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:#0e0e10;text-align:left;}
  .acc-trigger:hover{background:#fafafa;}
  .acc-trigger:disabled{color:#b5b3b8;cursor:not-allowed;}
  .acc-chevron{width:16px;height:16px;flex-shrink:0;color:#77767c;transition:transform .24s cubic-bezier(.2,.7,.2,1);}
  .acc-item.on .acc-chevron{transform:rotate(180deg);}
  .acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s cubic-bezier(.2,.7,.2,1);}
  .acc-item.on .acc-panel{grid-template-rows:1fr;}
  .acc-inner{overflow:hidden;min-height:0;}
  .acc-item.on .acc-inner{padding:0 16px 16px;}
  .acc-inner p{margin:0;font-size:13px;line-height:1.55;color:#3e3e44;}

  /* ===== Fab ===== */
  .fab{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;border-radius:14px;box-shadow:0 6px 20px rgba(14,14,16,.18);font-family:'Switzer',sans-serif;font-weight:600;transition:background .16s,box-shadow .16s,transform .16s;}
  .fab:hover{box-shadow:0 10px 28px rgba(14,14,16,.24);}
  .fab:active{transform:scale(.96);}
  .fab-md{width:44px;height:44px;}.fab-lg{width:56px;height:56px;}
  .fab-md svg{width:18px;height:18px;}.fab-lg svg{width:22px;height:22px;}
  .fab-ext{width:auto;border-radius:999px;padding:0 22px;font-size:14px;}
  .fab-ext.fab-md{height:44px;}.fab-ext.fab-lg{height:56px;}
  .fab-primary{background:#10b981;color:#fff;}
  .fab-primary:hover{background:#006c49;}
  .fab-surface{background:#fff;color:#0e0e10;box-shadow:0 6px 20px rgba(14,14,16,.18),inset 0 0 0 1px #e8e8ea;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useMemo, useState } = React;
const cn = (...v) => v.filter(Boolean).join(" ");
const IconPlus = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;

/* ---------- Calendar (porta fiel de refy-ui/src/components/Calendar) ---------- */
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const firstOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const sameDay = (a, b) => !!a && !!b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

function Calendar({ value, defaultValue = null, onChange, min, weekStartsOn = 0, locale = "pt-BR" }) {
  const [selInternal, setSelInternal] = useState(defaultValue);
  const selected = value !== undefined ? value : selInternal;
  const [view, setView] = useState(firstOfMonth(selected ?? new Date()));
  const [focused, setFocused] = useState(selected ?? new Date());
  const today = startOfDay(new Date());
  const minD = min ? startOfDay(min) : null;
  const isDisabled = (d) => (minD && d < minD) || false;

  const monthLabel = useMemo(() => {
    const s = new Intl.DateTimeFormat(locale, { month: "long", year: "numeric" }).format(view);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }, [view, locale]);
  const weekdays = useMemo(() => {
    const base = new Date(2024, 0, 7);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(base); d.setDate(base.getDate() + ((i + weekStartsOn) % 7));
      return new Intl.DateTimeFormat(locale, { weekday: "narrow" }).format(d);
    });
  }, [locale, weekStartsOn]);
  const grid = useMemo(() => {
    const first = firstOfMonth(view);
    const offset = (first.getDay() - weekStartsOn + 7) % 7;
    const start = new Date(first); start.setDate(first.getDate() - offset);
    return Array.from({ length: 42 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  }, [view, weekStartsOn]);

  function select(d) {
    if (isDisabled(d)) return;
    const day = startOfDay(d);
    if (value === undefined) setSelInternal(day);
    setFocused(day);
    if (day.getMonth() !== view.getMonth()) setView(firstOfMonth(day));
    onChange && onChange(day);
  }
  function moveFocus(n){ const nx=new Date(focused); nx.setDate(focused.getDate()+n); setFocused(nx); if(nx.getMonth()!==view.getMonth()||nx.getFullYear()!==view.getFullYear()) setView(firstOfMonth(nx)); }
  function onKeyDown(e){ const k=e.key; if(k==="ArrowLeft"){e.preventDefault();moveFocus(-1);}else if(k==="ArrowRight"){e.preventDefault();moveFocus(1);}else if(k==="ArrowUp"){e.preventDefault();moveFocus(-7);}else if(k==="ArrowDown"){e.preventDefault();moveFocus(7);}else if(k==="PageUp"){e.preventDefault();setView(addMonths(view,-1));}else if(k==="PageDown"){e.preventDefault();setView(addMonths(view,1));}else if(k==="Enter"||k===" "){e.preventDefault();select(focused);} }

  return (
    <div className="cal">
      <div className="cal-head">
        <button className="cal-nav" aria-label="Mês anterior" onClick={()=>setView(addMonths(view,-1))}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <span className="cal-month">{monthLabel}</span>
        <button className="cal-nav" aria-label="Próximo mês" onClick={()=>setView(addMonths(view,1))}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div className="cal-weekrow">{weekdays.map((w,i)=><span key={i} className="cal-wd">{w}</span>)}</div>
      <div className="cal-grid" role="grid" onKeyDown={onKeyDown}>
        {grid.map((d)=>{
          const outside=d.getMonth()!==view.getMonth(), disabled=isDisabled(d), isSel=sameDay(d,selected), isToday=sameDay(d,today), isFoc=sameDay(d,focused);
          return <button key={d.toISOString()} role="gridcell" tabIndex={isFoc?0:-1} aria-selected={isSel} disabled={disabled}
            className={cn("cal-day", outside&&"cal-out", isSel&&"cal-sel", isToday&&!isSel&&"cal-today", disabled&&"cal-dis")}
            onClick={()=>select(d)} onFocus={()=>setFocused(d)}>{d.getDate()}</button>;
        })}
      </div>
    </div>
  );
}

/* ---------- Accordion ---------- */
function Accordion({ items, type = "single", defaultValue = [] }) {
  const [open, setOpen] = useState(defaultValue);
  function toggle(id){ const isOpen=open.includes(id); setOpen(type==="single" ? (isOpen?[]:[id]) : (isOpen?open.filter(x=>x!==id):[...open,id])); }
  return (
    <div className="acc">
      {items.map((it)=>{
        const isOpen=open.includes(it.id);
        return (
          <div key={it.id} className={cn("acc-item", isOpen&&"on")}>
            <button className="acc-trigger" aria-expanded={isOpen} disabled={it.disabled} onClick={()=>toggle(it.id)}>
              <span>{it.title}</span>
              <svg className="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div className="acc-panel"><div className="acc-inner"><p>{it.body}</p></div></div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Fab ---------- */
function Fab({ icon, label, extended=false, size="lg", variant="primary" }) {
  const isExt = extended && !!label;
  return (
    <button type="button" aria-label={!isExt?label:undefined} className={cn("fab","fab-"+size,"fab-"+variant, isExt&&"fab-ext")}>
      <span style={{display:"inline-flex"}}>{icon}</span>{isExt && <span>{label}</span>}
    </button>
  );
}

/* ---------- Controls primitives ---------- */
const Seg = ({value,options,onChange}) => (
  <div className="seg">{options.map(o=><button key={o.v} className={value===o.v?"on":""} onClick={()=>onChange(o.v)}>{o.l}</button>)}</div>
);

/* ---------- Playground stories ---------- */
const FAQ = [
  { id:"a", title:"Como os créditos são cobrados?", body:"100 créditos por análise padrão, 300 por síntese profunda. Acumulativos, nunca expiram." },
  { id:"b", title:"Posso mudar de plano quando quiser?", body:"Sim. Upgrade na hora; downgrade no próximo ciclo. Créditos acumulados permanecem." },
  { id:"c", title:"E se eu cancelar?", body:"Acesso até o fim do período pago; depois o workspace vira read-only." },
];

function CalendarStory(){
  const [d,setD]=useState(new Date());
  const [wk,setWk]=useState(0);
  const [lim,setLim]=useState(false);
  return {
    node:<Calendar value={d} onChange={setD} weekStartsOn={wk} min={lim?new Date():undefined} />,
    controls:(
      <div className="ctl-row">
        <div className="ctl"><label>weekStartsOn</label><Seg value={wk} onChange={setWk} options={[{v:0,l:"Domingo"},{v:1,l:"Segunda"}]}/></div>
        <label className="chk"><input type="checkbox" checked={lim} onChange={e=>setLim(e.target.checked)}/> min = hoje</label>
        <div className="ctl"><label>value (onChange)</label><span className="out">{d?d.toLocaleDateString("pt-BR"):"—"}</span></div>
      </div>
    )
  };
}
function AccordionStory(){
  const [type,setType]=useState("single");
  return { node:<Accordion key={type} items={FAQ} type={type} defaultValue={["a"]} />,
    controls:<div className="ctl-row"><div className="ctl"><label>type</label><Seg value={type} onChange={setType} options={[{v:"single",l:"Single"},{v:"multiple",l:"Múltiplo"}]}/></div></div> };
}
function FabStory(){
  const [size,setSize]=useState("lg");
  const [variant,setVariant]=useState("primary");
  const [ext,setExt]=useState(false);
  return { node:<Fab icon={IconPlus} label="Nova análise" size={size} variant={variant} extended={ext} />,
    controls:(<div className="ctl-row">
      <div className="ctl"><label>size</label><Seg value={size} onChange={setSize} options={[{v:"md",l:"md"},{v:"lg",l:"lg"}]}/></div>
      <div className="ctl"><label>variant</label><Seg value={variant} onChange={setVariant} options={[{v:"primary",l:"primary"},{v:"surface",l:"surface"}]}/></div>
      <label className="chk"><input type="checkbox" checked={ext} onChange={e=>setExt(e.target.checked)}/> extended</label>
    </div>) };
}

const STORIES = {
  Calendar:{ group:"Formulários", src:"components/Calendar/Calendar.tsx", use:CalendarStory },
  Accordion:{ group:"Dados", src:"components/Accordion/Accordion.tsx", use:AccordionStory },
  Fab:{ group:"Ações", src:"components/Fab/Fab.tsx", use:FabStory },
};

function App(){
  const names=Object.keys(STORIES);
  const [sel,setSel]=useState(names[0]);
  const story=STORIES[sel].use();
  const groups={};
  names.forEach(n=>{ (groups[STORIES[n].group]=groups[STORIES[n].group]||[]).push(n); });
  return (
    <>
      <aside className="rail">
        <div className="rail-head">
          <span className="logo">refy<span className="logo-dot"></span></span>
          <div className="logo-sub">Playground · ao vivo</div>
        </div>
        <div className="rail-list">
          {Object.keys(groups).map(g=>(
            <div key={g}>
              <div className="rail-grp">{g}</div>
              {groups[g].map(n=><button key={n} className={cn("rail-item", n===sel&&"on")} onClick={()=>setSel(n)}>{n}</button>)}
            </div>
          ))}
        </div>
      </aside>
      <main className="stage">
        <div className="stage-head"><h1>{sel}</h1><span className="tag">refy-ui/src/{STORIES[sel].src}</span></div>
        <div className="stage-body">
          <div className="canvas">{story.node}</div>
          <div className="controls"><h2>Controls</h2>{story.controls}</div>
        </div>
      </main>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
