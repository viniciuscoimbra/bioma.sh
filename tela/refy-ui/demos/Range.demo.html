<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Range — Refy UI (demo)</title>
<link rel="stylesheet" href="../src/tokens/tokens.css" />
<link rel="stylesheet" href="../src/styles/global.css" />
<style>
*{box-sizing:border-box} body{margin:0;background:var(--surface-2);font-family:var(--font-body,system-ui);color:var(--ink-1)} .page{max-width:900px;margin:0 auto;padding:40px 32px 80px}.kicker{font:600 11px var(--font-mono,monospace);text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3)}h1{margin:6px 0 4px;font-size:28px}.lead{margin:0 0 24px;max-width:60ch;color:var(--ink-2);line-height:1.55}.import{display:inline-block;margin-bottom:28px;padding:10px 14px;border-radius:8px;background:var(--ink-1);color:var(--primary);font:12px var(--font-mono,monospace)}.story{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.story-head{padding:14px 18px;border-bottom:1px solid var(--line-soft)}.story-title{font-weight:700}.story-desc{margin-top:3px;color:var(--ink-3);font-size:12px}.canvas{position:relative;min-height:280px;padding:40px;display:grid;place-items:center;background:linear-gradient(var(--surface-2) 1px,transparent 1px) 0 0/100% 16px,var(--surface)}button,input{font:inherit}.button{border:1px solid var(--line);border-radius:var(--radius-default);background:var(--surface);padding:8px 14px;cursor:pointer}.button.primary{background:var(--primary);color:var(--on-primary,var(--surface));border-color:var(--primary)}.field{position:relative;width:320px;display:grid;gap:6px}.field.wide{width:420px}.field label{font:600 11px var(--font-mono,monospace);text-transform:uppercase;color:var(--ink-3)}.input{min-height:38px;border:1px solid var(--line);border-radius:var(--radius-default);background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 12px;text-align:left}.pop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:3;min-width:220px;padding:6px;border:1px solid var(--line);border-radius:var(--radius-default);background:var(--surface);box-shadow:var(--elev-3)}.open .pop,.hover:hover .cardpop{display:block}.option{display:flex;justify-content:space-between;gap:16px;padding:8px 10px;border-radius:7px;color:var(--ink-2)}.option.active,.option:hover{background:var(--surface-2);color:var(--ink-1)}.danger{color:var(--critical)}.chip{border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);padding:3px 8px;font-size:12px}.range{width:440px}.range-head{display:flex;justify-content:space-between;margin-bottom:14px}.range input{width:100%;accent-color:var(--primary)}.track{position:relative;height:6px;background:var(--line-soft);border-radius:999px}.track i{position:absolute;top:0;bottom:0;background:var(--primary);border-radius:999px}.track b{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--primary);transform:translate(-50%,-50%)}.otp{display:flex;gap:8px}.otp input{width:38px;height:42px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.modal{width:520px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--elev-4);padding:10px}.cardpop{display:none;position:absolute;top:calc(100% + 8px);left:50%;width:240px;transform:translateX(-50%);padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--elev-3)}.hover{position:relative}.drawer{display:none;position:absolute;right:20px;top:20px;bottom:20px;width:280px;padding:20px;border-left:1px solid var(--line);background:var(--surface);box-shadow:var(--elev-4)}.open .drawer{display:block}.toast,.snack{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--ink-1);color:var(--surface);box-shadow:var(--elev-3)}.toast{flex-direction:column;align-items:flex-start}.toast button,.snack button{color:var(--primary);background:transparent;border:0}.skeleton-card{width:320px;display:grid;gap:12px}.skeleton-card>*{display:block;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--surface-2),var(--line-soft),var(--surface-2));animation:pulse 1.2s linear infinite}.skeleton-card i{width:56px;height:56px;border-radius:16px}.skeleton-card b{width:70%}.skeleton-card span:last-child{width:45%}@keyframes pulse{to{background-position:320px}}.crumb{font:600 12px var(--font-mono,monospace);text-transform:uppercase;color:var(--ink-3)}.crumb span{padding:0 8px;color:var(--ink-4)}.pages,.seg,.tog{display:flex;gap:6px}.pages button,.seg button,.tog button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:34px;height:34px}.pages .active,.seg .active,.tog .active{background:var(--primary);border-color:var(--primary);color:var(--on-primary,var(--surface))}.empty{text-align:center;display:grid;gap:10px;place-items:center}.empty-icon{width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3)}.matrix{position:relative;width:560px;height:300px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 18px 18px,color-mix(in srgb,var(--primary) 12%,transparent) 1px,transparent 2px) 0 0/24px 24px,var(--surface)}.matrix:before,.matrix:after{content:"";position:absolute;background:var(--line)}.matrix:before{left:50%;top:0;bottom:0;width:1px}.matrix:after{top:50%;left:0;right:0;height:1px}.matrix span,.matrix em{position:absolute;font:600 10px var(--font-mono,monospace);text-transform:uppercase;color:var(--ink-3)}.matrix span{left:14px;top:50%;transform:rotate(-90deg)}.matrix em{left:50%;bottom:12px}.matrix button{position:absolute;width:30px;height:30px;border:0;border-radius:50%;background:var(--primary);color:var(--surface);font:700 11px var(--font-mono,monospace);transform:translate(-50%,50%)}.matrix .active{box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--primary);transform:translate(-50%,50%) scale(1.18)}.chart{width:520px}.chart svg{width:100%;height:auto}.chart line{stroke:var(--line)}.chart polyline{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.legend{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--ink-2);font-size:13px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--primary)}.workspace{display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;text-align:left}.workspace small{grid-column:2;color:var(--ink-3)}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--surface);font-weight:700}.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px}.bell span{position:absolute;right:-4px;top:-5px;background:var(--critical);color:white;border-radius:999px;font-size:10px;padding:2px 5px}.notify{width:280px}.shortcuts{display:flex;gap:8px;align-items:center}.shortcuts kbd,kbd{min-width:24px;height:24px;display:inline-grid;place-items:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface-2);font:600 12px var(--font-mono,monospace)}hr{border:0;border-top:1px solid var(--line-soft);width:100%}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="kicker">Components · Atoms</div>
  <h1>Range</h1>
  <p class="lead">Controle de intervalo com dois thumbs. Demo standalone: abra este arquivo diretamente, sem npm nem Storybook.</p>
  <div class="import">import { Range } from "@refy/ui";</div>
  <section class="story">
    <div class="story-head"><div class="story-title">Estado principal</div><div class="story-desc">Clique no trigger quando houver menu/overlay.</div></div>
    <div class="canvas"><div class="demo"><div class="range"><div class="range-head"><b>Faixa de creditos</b><span>300 - 1200</span></div><div class="track"><i style="left:24%;right:28%"></i><b style="left:24%"></b><b style="left:72%"></b></div></div></div></div>
  </section>
</div>
<script>document.addEventListener('click',function(e){var t=e.target.closest('.js-toggle'); if(!t)return; var host=t.closest('.demo')||t.parentElement; host.classList.toggle('open'); t.setAttribute('aria-expanded',host.classList.contains('open')?'true':'false');});</script>
</body>
</html>
